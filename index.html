<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nous² Budget</title>
<meta name="description" content="Budget partagé à deux" />
<meta name="theme-color" content="#5FA083" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ad&Lie Budget" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />

<!-- React + Babel (no build step needed) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- Tailwind CDN (utility classes at runtime) -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
  html, body { margin: 0; padding: 0; background: #F7F5F1; }
  #root { max-width: 480px; margin: 0 auto; min-height: 100vh; }
</style>
</head>
<body>
<script>
  // Unregister any leftover service worker from earlier testing, just in case.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
  }
</script>
<div id="root"></div>

<!--
  ============================================================
  CONFIGURATION FIREBASE — déjà remplie pour ce projet
  ============================================================
-->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDpeFavzMZf7YARNYUWonCzQVXV0RVYfvk",
    authDomain: "budget-862425.firebaseapp.com",
    projectId: "budget-862425",
    storageBucket: "budget-862425.firebasestorage.app",
    messagingSenderId: "1031003963715",
    appId: "1:1031003963715:web:d9d2072fab191b9cea2ff6"
  };

  const DOC_ID = "nous2-budget"; // identifiant fixe du foyer, partagé par les deux téléphones

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const ref = db.collection("households").doc(DOC_ID);

  window.fb = {
    async getShared() {
      const snap = await ref.get();
      return snap.exists ? snap.data() : null;
    },
    async setShared(value) {
      await ref.set(value);
    },
    subscribeShared(callback) {
      return ref.onSnapshot(
        (snap) => callback(snap.exists ? snap.data() : null),
        () => callback(null)
      );
    },
  };

  // Shim compatible with the app's existing storage calls: shared -> Firestore, personal -> localStorage
  window.storage = {
    async get(key, shared) {
      if (shared) {
        const val = await window.fb.getShared();
        return val ? { key, value: JSON.stringify(val), shared } : null;
      }
      const v = localStorage.getItem(key);
      return v != null ? { key, value: v, shared } : null;
    },
    async set(key, value, shared) {
      if (shared) {
        await window.fb.setShared(JSON.parse(value));
      } else {
        localStorage.setItem(key, value);
      }
      return { key, value, shared };
    },
    async delete(key, shared) {
      if (!shared) localStorage.removeItem(key);
      return { key, deleted: true, shared };
    },
    async list(prefix, shared) {
      if (shared) return { keys: [] };
      return { keys: Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix)) };
    },
  };

  window.dispatchEvent(new Event("fb-ready"));
</script>

<!-- App (JSX transpiled in-browser by Babel standalone, loaded manually to avoid any conflict with the page's other scripts) -->
<script>
  fetch('app.js?v=9')
    .then((r) => r.text())
    .then((code) => {
      const transformed = Babel.transform(code, { presets: [['react', { runtime: 'classic' }]] }).code;
      const s = document.createElement('script');
      s.textContent = transformed;
      document.body.appendChild(s);
    })
    .catch((err) => {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#a33;">Erreur de chargement de l\'application : ' + err + '</div>';
    });
</script>
</body>
</html>
